name: Build
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Keystore
        env: { KS: "${{ secrets.KEYSTORE_B64 }}" }
        run: if [ -n "$KS" ]; then echo "$KS" | base64 -d > jarvis.jks; fi
      - run: gradle assembleRelease -Pvc=${{ github.run_number }} --no-daemon
      - run: mv app/build/outputs/apk/release/app-release.apk Jarvis.apk
      - uses: actions/upload-artifact@v4
        with: { name: Jarvis, path: Jarvis.apk }
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create v${{ github.run_number }} Jarvis.apk --title "Jarvis v${{ github.run_number }}" --notes "Release build" --latest
